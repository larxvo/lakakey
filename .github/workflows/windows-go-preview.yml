name: Build Lakakey Go Windows preview EXE (not IME)
on:
  workflow_dispatch:
  push:
    paths:
      - 'winpreview/**'
      - '.github/workflows/windows-go-preview.yml'
permissions:
  contents: read
jobs:
  windows-preview:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build native Windows preview app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force winpreview/installer/payload | Out-Null
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o winpreview/installer/payload/LakakeyPreview.exe winpreview/app/main.go
      - name: Build one-click setup
        shell: pwsh
        run: |
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o LakakeyPreviewSetup.exe winpreview/installer/main.go
          if (!(Test-Path LakakeyPreviewSetup.exe)) { throw 'EXE missing' }
      - name: Upload setup and app
        uses: actions/upload-artifact@v4
        with:
          name: LakakeyPreview-Windows-x64
          path: |
            LakakeyPreviewSetup.exe
            winpreview/installer/payload/LakakeyPreview.exe
            winpreview/installer/payload/mascot.bmp
