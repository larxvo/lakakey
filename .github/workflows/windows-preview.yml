name: Windows preview — build installer and prerelease

on:
  push:
    branches: [main]
    paths:
      - 'winpreview/**'
      - '.github/workflows/windows-preview.yml'
      - 'docs/INSTALL_VI.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-preview:
    name: Build and package Windows x64 preview
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Compile Lakakey desktop preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force winpreview/installer/payload | Out-Null
          if (!(Test-Path 'winpreview/installer/payload/mascot.bmp')) { throw 'mascot.bmp is missing' }
          if (!(Test-Path 'winpreview/installer/payload/README_PREVIEW.txt')) { throw 'README_PREVIEW.txt is missing' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o winpreview/installer/payload/LakakeyPreview.exe winpreview/app/main.go
          if ($LASTEXITCODE -ne 0) { throw 'Settings build failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o LakakeyPreviewSetup.exe winpreview/installer/main.go
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          if ((Get-Item LakakeyPreviewSetup.exe).Length -lt 100000) { throw 'Installer too small or invalid' }
          if ((Get-Item winpreview/installer/payload/LakakeyPreview.exe).Length -lt 100000) { throw 'App too small or invalid' }
          Get-FileHash LakakeyPreviewSetup.exe -Algorithm SHA256 | Format-List

      - name: Upload downloadable installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LakakeyPreview-Windows-x64
          if-no-files-found: error
          retention-days: 90
          path: |
            LakakeyPreviewSetup.exe
            winpreview/installer/payload/LakakeyPreview.exe
            winpreview/installer/payload/README_PREVIEW.txt

      - name: Publish clearly labeled prerelease (not an IME)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v0.8.0-preview'
          $notes = @'
          LAKAKEY WINDOWS SETTINGS PREVIEW — NOT A VIETNAMESE INPUT METHOD.

          This is a demonstration of the Lakakey Windows Settings UI and optional mascot configuration. It does NOT type Vietnamese in Word, Chrome, Edge, Notepad, VS Code or other applications.
          Continue using UniKey for Vietnamese input. There is no signed or verified production IME yet.

          Install: download LakakeyPreviewSetup.exe, double-click, read the warning, and choose Yes to install.
          Uninstall: Windows Settings > Apps > Installed apps > Lakakey Desktop Preview.

          © 2026 Larx Vo — https://vovinhlac.com. Free preview.
          '@
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null) {
            gh release upload $tag ./LakakeyPreviewSetup.exe --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          } else {
            gh release create $tag ./LakakeyPreviewSetup.exe --title 'Lakakey v0.8.0 PREVIEW — Settings Only (Not an IME)' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Prerelease creation failed' }
          }
