name: Lakakey 0.14 — TSF atomic text commits and input compatibility checks
on:
  push:
    branches: [main, feature/tsf-native-edit-session, feature/lakakey-0.12-native-input, feature/lakakey-0.13-windows-compat, feature/lakakey-0.14-input-compat]
    paths: ['desktop/**','include/**','src/**','tests/**','platform/windows/tsf/**','CMakeLists.txt','go.mod','.github/workflows/windows-desktop-beta.yml']
  pull_request:
    paths: ['desktop/**','include/**','src/**','tests/**','platform/windows/tsf/**','CMakeLists.txt','go.mod','.github/workflows/windows-desktop-beta.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-linux:
    name: Linux C++ engine tests and Go race checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build C++ core and run all regression tests
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DLAKAKEY_BUILD_TESTS=ON
          cmake --build build-linux --parallel 2
          ctest --test-dir build-linux --output-on-failure
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test native desktop configuration
        run: |
          go vet ./desktop/windows
          go test -race -count=1 ./desktop/windows
  native-windows:
    name: Windows x64 native C++ TSF compile and standalone installer
    runs-on: windows-2022
    needs: core-linux
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Validate configuration on Windows
        shell: pwsh
        run: go test -count=1 ./desktop/windows
      - name: Compile C++ engine and experimental TSF with MSVC
        shell: pwsh
        run: |
          cmake -S . -B build-win -A x64 -DLAKAKEY_BUILD_TESTS=ON -DLAKAKEY_BUILD_TSF_V2=ON -DLAKAKEY_BUILD_EXPERIMENTAL_TSF=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Native configuration failed' }
          cmake --build build-win --config Release --target lakakey_tests lakakey_session_tests lakakey_contract_tests lakakey_typing_pipeline_tests lakakey_tsf_policy_tests LakakeyTsfV2 LakakeyTsfSmokeHost LakakeyTsfComSmoke LakakeyKeyboardLayoutSmoke LakakeyTsfRegistrationSmoke LakakeyTsfLabCtl
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          ctest --test-dir build-win -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Core regression tests failed' }
      - name: Ephemeral TSF registration and cleanup smoke
        shell: pwsh
        run: |
          $smoke = (Resolve-Path 'build-win/Release/LakakeyTsfRegistrationSmoke.exe').Path
          $dll = (Resolve-Path 'build-win/Release/LakakeyTsfV2.dll').Path
          & $smoke $dll '--ephemeral-runner'
          if ($LASTEXITCODE -ne 0) { throw 'TSF profile registration test failed; no user release allowed' }
      - name: Compile Windows app and per-user setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/installer/payload | Out-Null
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o desktop/installer/payload/LakakeyDesktop.exe ./desktop/windows
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o LakakeyDesktopSetup.exe ./desktop/installer
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }
          if ((Get-Item LakakeyDesktopSetup.exe).Length -lt 200000) { throw 'Invalid setup size' }
          Get-FileHash LakakeyDesktopSetup.exe -Algorithm SHA256
          Get-FileHash desktop/installer/payload/LakakeyDesktop.exe -Algorithm SHA256
      - name: Smoke-test desktop mode publication (not text input)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'desktop/installer/payload/LakakeyDesktop.exe'
          $app = Start-Process -FilePath $exe -ArgumentList '--tray' -PassThru
          try {
            $key = 'HKCU\Software\LarxVo\Lakakey\Input'
            $ok = $false
            for ($i=0; $i -lt 20; $i++) {
              $enabled = reg query $key /v Enabled 2>$null
              $scheme = reg query $key /v Scheme 2>$null
              if ($LASTEXITCODE -eq 0 -and $enabled -match 'REG_DWORD' -and $scheme -match 'REG_DWORD') {
                $ok = $true
                break
              }
              Start-Sleep -Milliseconds 200
            }
            if (-not $ok) { throw 'Lakakey did not publish native input preferences' }
          } finally {
            Start-Process -FilePath $exe -ArgumentList '--quit' -Wait
            $app.WaitForExit(3000) | Out-Null
          }
      - name: Generate checksums and build identity
        shell: pwsh
        run: |
          $files = @(
            'LakakeyDesktopSetup.exe',
            'desktop/installer/payload/LakakeyDesktop.exe'
          )
          $hashLines = foreach ($f in $files) {
            $sha = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sha  $f"
          }
          $hashLines | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8
          $info = [ordered]@{
            product = 'Lakakey'
            version = '0.14.0'
            git_commit = $env:GITHUB_SHA
            target = 'windows-amd64'
            artifact = 'desktop-controller-only'
            tsf_installed = $false
            publisher = 'Larx Vo'
          }
          ($info | ConvertTo-Json -Depth 3) | Set-Content -LiteralPath BUILD_INFO.json -Encoding utf8
      - name: Upload runnable desktop-only beta
        uses: actions/upload-artifact@v4
        with:
          name: Lakakey-0.14-Windows-x64-Dev
          if-no-files-found: error
          retention-days: 30
          path: |
            LakakeyDesktopSetup.exe
            desktop/installer/payload/LakakeyDesktop.exe
            desktop/installer/payload/README.txt
            SHA256SUMS.txt
            BUILD_INFO.json
      - name: Archive current source revision
        shell: pwsh
        run: |
          git archive --format=zip -o Lakakey-0.14-Source.zip HEAD
          if ($LASTEXITCODE -ne 0 -or !(Test-Path Lakakey-0.14-Source.zip)) {
            throw 'Source archive generation failed'
          }
      - name: Upload source revision
        uses: actions/upload-artifact@v4
        with:
          name: Lakakey-0.14-Complete-Source
          if-no-files-found: error
          retention-days: 30
          path: Lakakey-0.14-Source.zip
      - name: Upload research-only TSF DLL separately
        uses: actions/upload-artifact@v4
        with:
          name: TSF-v2-research-NOT-FOR-END-USERS
          if-no-files-found: error
          retention-days: 14
          path: |
            build-win/Release/LakakeyTsfV2.dll
            build-win/Release/LakakeyTsfSmokeHost.exe
            build-win/Release/LakakeyTsfComSmoke.exe
            build-win/Release/LakakeyKeyboardLayoutSmoke.exe
            build-win/Release/LakakeyTsfRegistrationSmoke.exe
            build-win/Release/LakakeyTsfLabCtl.exe
# Stable releases must pass native OS QA and publisher signing; no automatic release.
