name: Windows Desktop Beta — compile, verify, package

on:
  push:
    branches: [main, feature/tsf-native-edit-session]
    paths:
      - 'desktop/**'
      - 'go.mod'
      - '.github/workflows/windows-desktop-beta.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'go.mod'
      - '.github/workflows/windows-desktop-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test configuration and supported choices
        run: go test -v ./desktop/windows

  windows-beta:
    name: Build Windows x64 app + standalone installer
    runs-on: windows-2022
    needs: desktop-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Unit tests on native Windows runner
        run: go test ./desktop/windows
      - name: Build application and embedded per-user setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/installer/payload | Out-Null
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o desktop/installer/payload/LakakeyDesktop.exe ./desktop/windows
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o LakakeyDesktopSetup.exe ./desktop/installer
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }
          if ((Get-Item LakakeyDesktopSetup.exe).Length -lt 200000) { throw 'Setup too small' }
          if ((Get-Item desktop/installer/payload/LakakeyDesktop.exe).Length -lt 200000) { throw 'Application too small' }
          Get-FileHash LakakeyDesktopSetup.exe -Algorithm SHA256 | Format-List
          Get-FileHash desktop/installer/payload/LakakeyDesktop.exe -Algorithm SHA256 | Format-List
      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LakakeyDesktopBeta-Windows-x64
          if-no-files-found: error
          retention-days: 90
          path: |
            LakakeyDesktopSetup.exe
            desktop/installer/payload/LakakeyDesktop.exe
            desktop/installer/payload/README.txt
      - name: Publish tagged beta on main after review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.9.0-beta'
          $notes = @'
          Lakakey Desktop Beta — Windows native Settings, system tray and per-user installer.

          WARNING: This is NOT a functional Vietnamese system input method.
          The VN/EN switch changes preview state only; it does not type into Word,
          Notepad, Chrome, Edge, VS Code or any other Windows application.
          Keep using your current input method. No TSF IME is registered.

          Install: LakakeyDesktopSetup.exe, per-user, removable from Installed apps.
          Unsigned experimental build — no device compatibility or SmartScreen guarantees.

          Author: Larx Vo | https://vovinhlac.com | Copyright 2026
          '@
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null) {
            gh release upload $tag ./LakakeyDesktopSetup.exe --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Upload failed' }
          } else {
            gh release create $tag ./LakakeyDesktopSetup.exe --title 'Lakakey v0.9.0 BETA — native desktop, not an IME' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
